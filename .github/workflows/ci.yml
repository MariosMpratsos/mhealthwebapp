name: Build and Deploy to Contabo VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mariosmpratsos/mhealthwebapp/mhealth-backend
  FRONTEND_IMAGE: ghcr.io/mariosmpratsos/mhealthwebapp/mhealth-frontend

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Register Contabo Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Prepare Local Environment & Inventory
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

          echo "[vps]" > inventory.ini
          echo "${{ secrets.VPS_HOST }} ansible_user=${{ secrets.VPS_USER }}" >> inventory.ini

      - name: Run Ansible Deployment Playbook
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ansible-playbook -i inventory.ini deploy/ansible/playbook.yml
