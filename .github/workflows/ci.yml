name: CI/CD

on:
  push:
    branches: [main, test-ci-cd]
  pull_request:
    branches: [main, test-ci-cd]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # 1. BACKEND TESTS - MATRIX
  # ============================================================

  test-backend:
    name: Backend Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: server
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python manage.py test


  # ============================================================
  # 2. FRONTEND BUILD
  # ============================================================

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ============================================================
  # 3. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build


  # ============================================================
  # 4. CREATE IMMUTABLE IMAGE TAG
  # ============================================================

  image-tag:
    name: Create Image Tag
    runs-on: ubuntu-latest
    needs: docker-build

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Create immutable tag
        id: tag
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Docker image tag: $TAG"


  # ============================================================
  # 5. DEVELOPMENT DEPLOYMENT
  # ============================================================

  deploy-development:
    name: Deploy Development
    runs-on: ubuntu-latest
    needs: image-tag

    environment:
      name: development

    if: github.ref == 'refs/heads/test-ci-cd'

    steps:
      - name: Deploy application
        run: |
          echo "Deploying version ${{ needs.image-tag.outputs.tag }}"
          echo "Environment: development"


  # ============================================================
  # 6. STAGING DEPLOYMENT
  # ============================================================

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: deploy-development

    environment:
      name: staging

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application
        run: |
          echo "Deploying version ${{ needs.image-tag.outputs.tag }}"
          echo "Environment: staging"


  # ============================================================
  # 7. PRODUCTION DEPLOYMENT
  # ============================================================

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging

    environment:
      name: production

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application
        run: |
          echo "Deploying version ${{ needs.image-tag.outputs.tag }}"
          echo "Environment: production"


  # ============================================================
  # 8. HEALTH CHECK
  # ============================================================

  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Run health check
        run: |
          echo "Checking production health..."
          echo "Health check passed"


  # ============================================================
  # 9. CANARY DEPLOYMENT
  # ============================================================

  canary:
    name: Canary Deployment
    runs-on: ubuntu-latest
    needs: health-check

    environment:
      name: production

    steps:
      - name: Deploy canary
        run: |
          echo "Starting canary deployment"
          echo "10% traffic -> new version"
          echo "90% traffic -> old version"

      - name: Canary health check
        run: |
          echo "Checking canary metrics..."
          echo "Canary healthy"


  # ============================================================
  # 10. CANARY PROMOTION
  # ============================================================

  canary-promotion:
    name: Promote Canary
    runs-on: ubuntu-latest
    needs: canary

    steps:
      - name: Promote new version
        run: |
          echo "Increasing traffic..."
          echo "50% -> new version"
          echo "50% -> old version"

          echo "Final promotion..."
          echo "100% -> new version"


  # ============================================================
  # 11. ROLLBACK
  # ============================================================

  rollback:
    name: Rollback
    runs-on: ubuntu-latest

    if: failure()

    steps:
      - name: Rollback deployment
        run: |
          echo "Deployment failed."
          echo "Rolling back to previous immutable image."
