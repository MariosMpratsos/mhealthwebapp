- name: Deploy and Manage mHealth Stack
  hosts: vps
  become: yes

  vars:
    remote_dir: "{{ lookup('env', 'REMOTE_DIR') | default('/opt/mhealth', true) }}"

    github_repository: "{{ lookup('env', 'GITHUB_REPOSITORY') | lower }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    ghcr_user: "{{ lookup('env', 'GHCR_USER') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
    google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY') }}"
    django_secret_key: "{{ lookup('env', 'DJANGO_SECRET_KEY') }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"

  pre_tasks:
    - name: Collect missing required values
      ansible.builtin.set_fact:
        missing_vars: >-
          {{ {
            'GHCR_USER': ghcr_user,
            'GHCR_PULL_TOKEN': ghcr_token,
            'GOOGLE_API_KEY': google_api_key,
            'DJANGO_SECRET_KEY': django_secret_key,
            'GRAFANA_ADMIN_PASSWORD': grafana_admin_password
          } | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list }}
      no_log: true

    - name: Fail early if required secrets are missing
      ansible.builtin.fail:
        msg: "Missing or empty: {{ missing_vars | join(', ') }}"
      when: missing_vars | length > 0

  tasks:
    - name: Install system dependencies and Docker packages
      ansible.builtin.apt:
        update_cache: yes
        pkg:
          - ca-certificates
          - curl
          - gnupg
          - docker.io
          - docker-compose-v2
          - python3-docker
        state: present

    - name: Ensure Docker daemon is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Create remote project folder
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: "0755"

    - name: Write .env file from GitHub secrets
      ansible.builtin.copy:
        dest: "{{ remote_dir }}/.env"
        mode: "0600"
        content: |
          GITHUB_REPOSITORY={{ github_repository }}
          IMAGE_TAG={{ image_tag }}
          GOOGLE_API_KEY={{ google_api_key }}
          DJANGO_SECRET_KEY={{ django_secret_key }}
          GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}
      no_log: true

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: "../../docker-compose.yml"
        dest: "{{ remote_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copy Nginx configuration
      ansible.builtin.copy:
        src: "../../nginx/"
        dest: "{{ remote_dir }}/nginx/"

    - name: Copy monitoring configuration
      ansible.builtin.copy:
        src: "../../monitoring/"
        dest: "{{ remote_dir }}/monitoring/"

    - name: Log in to GHCR on the VPS
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_user }}"
        password: "{{ ghcr_token }}"
      no_log: true

    - name: Pull latest images and restart containers
      community.docker.docker_compose_v2:
        project_src: "{{ remote_dir }}"
        state: present
        pull: always
        remove_orphans: true
