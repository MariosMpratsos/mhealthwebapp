- name: Deploy and Manage mHealth Stack
  hosts: vps
  become: yes

  vars:
    remote_dir: "/opt/mhealth"

    github_repository: "{{ lookup('env', 'GITHUB_REPOSITORY') | lower }}"
    ghcr_user: "{{ lookup('env', 'GHCR_USER') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
    google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY') }}"
    django_secret_key: "{{ lookup('env', 'DJANGO_SECRET_KEY') }}"

  tasks:

    - name: Fail early if GITHUB_REPOSITORY is missing
      ansible.builtin.assert:
        that:
          - github_repository | length > 0
        fail_msg: "GITHUB_REPOSITORY is not set on the runner"

    - name: Fail early if GHCR credentials are missing
      ansible.builtin.assert:
        that:
          - ghcr_user | length > 0
          - ghcr_token | length > 0
        fail_msg: "GHCR credentials are not available"

    - name: Fail early if GOOGLE_API_KEY is missing
      ansible.builtin.assert:
        that:
          - google_api_key | length > 0
        fail_msg: "GOOGLE_API_KEY is not available"

    - name: Fail early if DJANGO_SECRET_KEY is missing
      ansible.builtin.assert:
        that:
          - django_secret_key | length > 0
        fail_msg: "DJANGO_SECRET_KEY is not available"

    - name: Install system dependencies and Docker packages
      ansible.builtin.apt:
        update_cache: yes
        pkg:
          - ca-certificates
          - curl
          - gnupg
          - docker.io
          - docker-compose-v2
          - python3-docker
        state: present

    - name: Ensure Docker daemon is running
      ansible.builtin.service:
        name: docker
        state: started

    - name: Create remote project folder
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: "../../docker-compose.yml"
        dest: "{{ remote_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copy Nginx configuration
      ansible.builtin.copy:
        src: "../../nginx/"
        dest: "{{ remote_dir }}/nginx/"

    - name: Copy monitoring configuration
      ansible.builtin.copy:
        src: "../../monitoring/"
        dest: "{{ remote_dir }}/monitoring/"

    - name: Log in to GHCR on the VPS
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_user }}"
        password: "{{ ghcr_token }}"
      no_log: true

    - name: Pull latest images and restart containers
      community.docker.docker_compose_v2:
        project_src: "{{ remote_dir }}"
        state: present
        pull: always
      environment:
        GITHUB_REPOSITORY: "{{ github_repository }}"
        GOOGLE_API_KEY: "{{ google_api_key }}"
        DJANGO_SECRET_KEY: "{{ django_secret_key }}"
      no_log: true
