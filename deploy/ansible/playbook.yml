```yaml
- name: Deploy and Manage mHealth Stack
  hosts: vps
  become: yes

  vars:
    remote_dir: "/opt/mhealth"

    github_repository: "{{ lookup('env', 'GITHUB_REPOSITORY') | lower }}"

    ghcr_user: "{{ lookup('env', 'GHCR_USER') }}"

    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"

  tasks:

    - name: Fail early if GITHUB_REPOSITORY is missing
      ansible.builtin.assert:
        that:
          - github_repository | length > 0
        fail_msg: "GITHUB_REPOSITORY is not set on the runner"

    - name: Fail early if GHCR credentials are missing
      ansible.builtin.assert:
        that:
          - ghcr_user | length > 0
          - ghcr_token | length > 0
        fail_msg: "GHCR credentials are not available"

    - name: Install system dependencies and Docker packages
      ansible.builtin.apt:
        update_cache: yes
        pkg:
          - ca-certificates
          - curl
          - gnupg
          - docker.io
          - docker-compose-v2
          - python3-docker
        state: present

    - name: Ensure Docker daemon is running
      ansible.builtin.service:
        name: docker
        state: started

    - name: Create remote project folder
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: "0755"

    - name: Synchronize Docker Compose configuration
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ remote_dir }}/{{ item.dest }}"
        mode: "{{ item.mode | default(omit) }}"
      loop:
        - src: "../../docker-compose.yml"
          dest: "docker-compose.yml"

        - src: "../../.env"
          dest: ".env"
          mode: "0600"

        - src: "../../nginx/"
          dest: "nginx/"

        - src: "../../monitoring/"
          dest: "monitoring/"

    - name: Log in to GHCR on the VPS
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_user }}"
        password: "{{ ghcr_token }}"
      no_log: true

    - name: Pull latest images and restart containers
      community.docker.docker_compose_v2:
        project_src: "{{ remote_dir }}"
        state: present
        pull: always
      environment:
        GITHUB_REPOSITORY: "{{ github_repository }}"
