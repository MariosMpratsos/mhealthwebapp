services:

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/mhealth-backend:${IMAGE_TAG:-latest}
    container_name: mhealth-backend
    restart: unless-stopped

    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      SQLITE_PATH: /data/db.sqlite3

    expose:
      - "8000"

    volumes:
      - backend-data:/data

    command: sh -c "python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8000 --workers 3 fitnessServer.wsgi:application"


  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/mhealth-frontend:${IMAGE_TAG:-latest}
    container_name: mhealth-frontend
    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - backend


  nginx:
    image: nginx:stable
    container_name: mhealth-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - frontend
      - backend
      - grafana


  certbot:
    image: certbot/certbot:latest
    container_name: mhealth-certbot
    restart: unless-stopped

    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done"

    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt


  prometheus:
    image: prom/prometheus:latest
    container_name: mhealth-prometheus
    restart: unless-stopped

    # No public port. For debugging, use an SSH tunnel to 127.0.0.1:9090:
    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    depends_on:
      - backend


  grafana:
    image: grafana/grafana:latest
    container_name: mhealth-grafana
    restart: unless-stopped

    # No published port: it's reached through nginx at /grafana/
    expose:
      - "3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus


volumes:
  prometheus-data:
  grafana-data:
  backend-data:
