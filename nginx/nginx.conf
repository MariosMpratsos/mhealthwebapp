events {
worker_connections 1024;
}

http {
# mHealth services
upstream frontend_upstream {
server frontend:80;
}

upstream backend_upstream {
    server backend:8000;
}

upstream grafana_upstream {
    server grafana:3000;
}

# E-commerce services
upstream ecommerce_frontend_upstream {
    server ecommerce-frontend:80;
}

upstream ecommerce_backend_upstream {
    server ecommerce-backend:5001;
}

# Main mHealth website
server {
    listen 80;
    server_name bratsos.online www.bratsos.online;

    client_max_body_size 25M;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API and admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics
    location /metrics {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# E-commerce website
server {
    listen 80;
    server_name ecommerce.bratsos.online;

    client_max_body_size 25M;

    # E-commerce API
    location /api/ {
        proxy_pass http://ecommerce_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # E-commerce frontend
    location / {
        proxy_pass http://ecommerce_frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

}
